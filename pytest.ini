[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery options
testpaths = tests

# Output formatting
console_output_style = progress
log_cli = True
log_cli_level = INFO

# Add CLI markers for different test categories
markers =
    unit: Unit tests that test a specific function or class in isolation
    integration: Tests that verify different parts of the system work together
    api: Tests for the Flask API endpoints
    workflow: Tests for the Temporal workflow
    activities: Tests for the workflow activities
    slow: Tests that are particularly time-consuming

# Configure asyncio for async tests
asyncio_mode = auto

# Configure coverage report
addopts = --cov=. --cov-report=term --cov-report=html --no-cov-on-fail
